name: build-sim-argmap-fix

# Builds a Sim.ai image with the workflow_executor arg-mapping fix and pushes it
# to GHCR. Runs on GitHub's free 16 GB public-repo runner; swap is added so the
# ~10.6 GB `next build` does not OOM.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /opt/pipx \
                      /usr/local/graalvm /opt/az /usr/local/lib/node_modules /imagegeneration
          docker image prune -af || true
          sudo docker system df || true
          df -h

      - name: Add swap (dd, not fallocate — swapoff the runner's default 4 GB first)
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          if sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=none 2>/dev/null; then
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile && echo "SWAP_ADDED=12GB" || echo "swapon failed; continuing (parallelism fix is primary)"
          else
            echo "swapfile create failed; continuing (parallelism fix is primary)"
          fi
          free -h

      - name: Build patched Sim.ai image
        run: node build.cjs --no-srcmaps --tag ghcr.io/hoanganhb680-arch/suasimai:latest

      - name: Inspect built image
        run: docker images | grep -i suasimai || docker images

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image to GHCR
        run: docker push ghcr.io/hoanganhb680-arch/suasimai:latest